# .github/workflows/collect.yml
name: Collect portfolio

on:
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect repo state
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_portfolio.py

      - name: Commit if changed
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/portfolio.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "portfolio: nightly collection $(date -u +%F)"
            git push
          fi